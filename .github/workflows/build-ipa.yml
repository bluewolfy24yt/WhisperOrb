name: Build & Release WhisperOrb v2.0.0 (.ipa & .apk)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Android Native NDK APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Clone Official whisper.cpp (b5454) for Android NDK
        run: |
          rm -rf android/app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch b5454 https://github.com/ggml-org/whisper.cpp.git android/app/src/main/cpp/whisper.cpp

      - name: 5. Build Release APK (WhisperOrb-Android.apk)
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erreur : APK introuvable !"
            exit 1
          fi
          cp "$APK_PATH" ../WhisperOrb-Android.apk
          ls -lh ../WhisperOrb-Android.apk

      - name: 6. Upload Android APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperOrb-Android-APK
          path: WhisperOrb-Android.apk
          if-no-files-found: error

      - name: 7. Publish Android APK to GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "WhisperOrb v2.0.0 — Apple (.ipa) & Android (.apk)"
          body: |
            ## 🫧 WhisperOrb `v2.0.0` — 100% On-Device Offline AI Voice Dictation & Native Keyboard (Apple & Android)

            ### 🇬🇧 Quick Download & Setup
            - 🤖 **Android, Tablets, Chromebook Plus & Googlebook 14 (`WhisperOrb-Android.apk` — `arm64-v8a` + `x86_64` AVX2)**:
              1. Install `WhisperOrb-Android.apk` and open **WhisperOrb** (Cosmic Dark Pro UI with automatic 2-column layout on Android Tablets & Googlebook 14).
              2. Download your preferred Whisper model (from **Whisper Nano 31 MB** up to **Whisper TITAN Large-v3 1.08 GB** on 12 GB+ RAM devices like the **Pixel 9 Pro XL** or **Googlebook 14**).
              3. Enable and select the **WhisperOrb Native Keyboard (`InputMethodService`)** in 2 taps: features the **120 Hz 3D Orb literally embedded inside the keyboard**, the **`▾ Réduire` collapsible 58dp voice bar**, **Smart AI Autocorrect & 3-Suggestion Bar**, **Full 9-Category Emoji Picker**, and **automatic pure numeric keypad mode** on number/PIN fields!
            - 🍎 **Apple iOS / iPadOS / macOS (`WhisperOrb-iPad.ipa`)**:
              1. Install via **SideStore**, **AltStore**, **Sideloadly**, or `isideload`.
              2. Download a model and enable the **WhisperOrb Keyboard** (featuring the embedded 3D Orb, `▾ Réduire` collapsible voice bar, **Smart AI Autocorrect & 3-Suggestion Bar**, full 9-category Apple Emoji Picker, accents, and `user_style_memory.json`).

            ---

            ### 🇫🇷 Téléchargement & Installation Rapide
            - 🤖 **Android, Tablettes, Chromebook Plus & Googlebook 14 (`WhisperOrb-Android.apk` — `arm64-v8a` + `x86_64` AVX2)** :
              1. Installez `WhisperOrb-Android.apk` et ouvrez **WhisperOrb** (nouvelle interface **Cosmic Dark Pro** avec mode 2 colonnes automatique sur Tablettes Android & Googlebook 14).
              2. Téléchargez l'un des **7 modèles Whisper** (de **Whisper Nano 31 Mo** jusqu'à **Whisper TITAN Large-v3 1,08 Go** sur les appareils 12 Go+ RAM comme le **Pixel 9 Pro XL** ou le **Googlebook 14**).
              3. Activez en 2 touches le **Clavier Natif WhisperOrb (`InputMethodService`)** : **Orbe 3D littéralement incrusté dans le clavier**, bouton **`▾ Réduire`** (barre vocale compacte de 58dp), **Correcteur Automatique IA & Barre de 3 prédictions**, **9 catégories d'émojis**, et **basculement automatique en clavier de chiffres pur** (sans Orbe) sur les champs numériques !
            - 🍎 **Apple iOS / iPadOS / macOS (`WhisperOrb-iPad.ipa`)** :
              1. Installez l'IPA via **SideStore**, **AltStore** ou **Sideloadly**.
              2. Téléchargez un modèle et activez le clavier WhisperOrb complet (avec l'Orbe 3D incrusté, le bouton `▾ Réduire`, le **Correcteur Automatique IA & Barre de 3 prédictions**, tous les émojis Apple, accents et mémoire `user_style_memory.json`).
          files: WhisperOrb-Android.apk
          draft: false
          prerelease: false
          make_latest: true

  build-ipa:
    name: Compile Unsigned iPadOS/iOS IPA on macOS 15
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: 3. Download Official whisper.cpp Metal GPU XCFramework
        run: |
          mkdir -p Frameworks
          curl -fL "https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-b5454-xcframework.zip" -o /tmp/whisper-xcf.zip
          unzip -q -o /tmp/whisper-xcf.zip -d /tmp/
          rm -rf Frameworks/whisper.xcframework
          mv /tmp/build-apple/whisper.xcframework Frameworks/whisper.xcframework
          plutil -replace MinimumOSVersion -string "16.0" Frameworks/whisper.xcframework/ios-arm64/whisper.framework/Info.plist

      - name: 4. Generate Xcode Project via XcodeGen
        run: xcodegen generate

      - name: 5. Build Release for iphoneos (Unsigned / Ad-Hoc)
        run: |
          xcodebuild build \
            -project WhisperOrb.xcodeproj \
            -scheme WhisperOrbApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 6. Package .app into WhisperOrb-iPad.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "WhisperOrbApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : WhisperOrbApp.app introuvable !"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r9 WhisperOrb-iPad.ipa Payload
          ls -lh WhisperOrb-iPad.ipa

      - name: 7. Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperOrb-iPad-IPA
          path: WhisperOrb-iPad.ipa
          if-no-files-found: error

      - name: 8. Publish Apple IPA to GitHub Release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "WhisperOrb v2.0.0 — Apple (.ipa) & Android (.apk)"
          files: WhisperOrb-iPad.ipa
          draft: false
          prerelease: false
          make_latest: true
