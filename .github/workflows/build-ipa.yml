name: Build & Release WhisperOrb v2.1.0 (.ipa & .apk)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Android Native NDK APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. Clone Official whisper.cpp (b5454) for Android NDK
        run: |
          rm -rf android/app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch b5454 https://github.com/ggml-org/whisper.cpp.git android/app/src/main/cpp/whisper.cpp

      - name: 5. Build Release APK (WhisperOrb-Android.apk)
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erreur : APK introuvable !"
            exit 1
          fi
          cp "$APK_PATH" ../WhisperOrb-Android.apk
          ls -lh ../WhisperOrb-Android.apk

      - name: 6. Upload Android APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperOrb-Android-APK
          path: WhisperOrb-Android.apk
          if-no-files-found: error

      - name: 7. Publish Android APK to GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "WhisperOrb v2.1.0 — Parité 1:1 Apple (.ipa) & Android Gboard (.apk)"
          body: |
            ## 🫧 WhisperOrb `v2.1.0` — Parité 1:1 Apple & Android + Incrustation Gboard 3-États + Easter Egg 7 Niveaux

            ### 🇫🇷 Nouveautés Majeures (`v2.1.0`)
            - 🤖 **Android (`WhisperOrb-Android.apk` — Jetpack Compose + Material 3)** :
              1. **Clone visuel et fonctionnel 1:1 de l'application Apple (`ContentView.swift`)** : les 6 cartes complètes, mode 2 colonnes automatique sur Tablettes & Googlebook 14, sélecteur de 32 couleurs + recherche de 140+ teintes FR/EN, ColorPickers RGB/Hex, curseur de silence VAD, mémoire `user_style_memory.json` et vrai QR Code.
              2. **Vrai Clavier Gboard conservé + Incrustation 3-États (`WhisperOrbAccessibilityService`)** :
                 - **État 1 (Gboard ouvert)** : bandeau vocal sombre style Apple verrouillé au pixel près juste au-dessus du sommet de Gboard (`imeRect.top - barHeight`), avec masquage automatique sur les claviers de chiffres/téléphone.
                 - **État 2 (Panneau `⚙` DANS la zone de Gboard)** : toucher `⚙` (ou maintenir l'Orbe) remplace les touches de Gboard par le panneau de réglages rapides WhisperOrb (Langues, 7 Modèles IA, 32 Couleurs d'Orbe).
                 - **État 3 (Rétractation physique `▾ Réduire`)** : toucher `▾ Réduire` rétracte physiquement Gboard et laisse uniquement la barre vocale compacte en bas de l'écran (avec `▴ Clavier` pour ré-ouvrir Gboard).
              3. **Conservation garantie des modèles téléchargés** : signature cryptographique permanente (`whisperorb-release.p12`) + stockage persistant dans `/sdcard/Android/media/com.whisperorb.app/Models/`.
            - 🔓 **Déblocage jusqu'à `Whisper Expert (v3 Turbo)` dès 4 Go RAM + Easter Egg des 7 Messages (Apple & Android, FR/EN)** :
              - Les appareils 4 Go RAM débloquent désormais les 5 premiers modèles jusqu'à **🚀 Whisper Expert (v3 Turbo)**.
              - Cliquer sur **« Débloquer »** lance l'Easter Egg progressif des **7 avertissements FR/EN** pour débloquer de force `Expert+ Q8` et `TITAN (1,08 Go)`.
          files: WhisperOrb-Android.apk
          draft: false
          prerelease: false
          make_latest: true

  build-ipa:
    name: Compile Unsigned iPadOS/iOS IPA on macOS 15
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: 3. Download Official whisper.cpp Metal GPU XCFramework
        run: |
          mkdir -p Frameworks
          curl -fL "https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-b5454-xcframework.zip" -o /tmp/whisper-xcf.zip
          unzip -q -o /tmp/whisper-xcf.zip -d /tmp/
          rm -rf Frameworks/whisper.xcframework
          mv /tmp/build-apple/whisper.xcframework Frameworks/whisper.xcframework
          plutil -replace MinimumOSVersion -string "16.0" Frameworks/whisper.xcframework/ios-arm64/whisper.framework/Info.plist

      - name: 4. Generate Xcode Project via XcodeGen
        run: xcodegen generate

      - name: 5. Build Release for iphoneos (Unsigned / Ad-Hoc)
        run: |
          xcodebuild build \
            -project WhisperOrb.xcodeproj \
            -scheme WhisperOrbApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 6. Package .app into WhisperOrb-iPad.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "WhisperOrbApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : WhisperOrbApp.app introuvable !"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r9 WhisperOrb-iPad.ipa Payload
          ls -lh WhisperOrb-iPad.ipa

      - name: 7. Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperOrb-iPad-IPA
          path: WhisperOrb-iPad.ipa
          if-no-files-found: error

      - name: 8. Publish Apple IPA to GitHub Release v2.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "WhisperOrb v2.1.0 — Parité 1:1 Apple (.ipa) & Android Gboard (.apk)"
          files: WhisperOrb-iPad.ipa
          draft: false
          prerelease: false
          make_latest: true
