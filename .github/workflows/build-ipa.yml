name: Build & Release WhisperOrb v2.2.0 (.ipa & .apk)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Compile Android Native NDK APK (arm64-v8a + x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 4. Clone Official whisper.cpp (b5454) for Android NDK
        run: |
          rm -rf android/app/src/main/cpp/whisper.cpp
          git clone --depth 1 --branch b5454 https://github.com/ggml-org/whisper.cpp.git android/app/src/main/cpp/whisper.cpp

      - name: 5. Build Release APK (WhisperOrb-Android.apk)
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Erreur : APK introuvable !"
            exit 1
          fi
          cp "$APK_PATH" ../WhisperOrb-Android.apk
          ls -lh ../WhisperOrb-Android.apk

      - name: 6. Upload Android APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperOrb-Android-APK
          path: WhisperOrb-Android.apk
          if-no-files-found: error

      - name: 7. Publish Android APK to GitHub Release v2.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "WhisperOrb v2.2.0 — Clavier Gboard/HeliBoard Natif avec Bandeau Incrusté (.apk & .ipa)"
          body: |
            ## 🫧 WhisperOrb `v2.2.0` — Clavier Gboard/HeliBoard Complet Intégré + Bandeau Incrusté dans le Code Source du Clavier

            ### 🇫🇷 Nouveautés Majeures (`v2.2.0`)
            - ⌨️ **Moteur Clavier Gboard / HeliBoard v3.2 Complet Intégré dans `WhisperOrb-Android.apk`** :
              1. **Bandeau WhisperOrb physiquement soudé DANS le code source du clavier (`main_keyboard_frame.xml` / `LatinIME`)** : zéro fenêtre flottante, zéro calcul de coordonnées écran, alignement parfait au pixel près au sommet du clavier.
              2. **Écriture Glissée (Swipe / Glide Typing) native pré-intégrée** (`libjni_latinimegoogle.so` arm64-v8a embarquée d'office).
              3. **Détection automatique de la langue système dès la 1ère seconde** : **AZERTY (Français)** + dictionnaire hors-ligne FR si le téléphone est en français, **QWERTY (English)** + dictionnaire hors-ligne EN si en anglais, avec support bilingue FR/EN, barre de suggestions/autocorrect, sélecteur d'Emojis et Presse-papiers.
              4. **3 États natifs dans le clavier** :
                 - **Normal** : Bandeau WhisperOrb en haut + Barre de suggestions Gboard + Touches AZERTY/QWERTY.
                 - **Réduit (`▾ Réduire`)** : replie les touches en interne (`View.GONE`) et redimensionne nativement la fenêtre du clavier Android (`onComputeInsets`) à `58dp` en bas de l'écran.
                 - **Réglages (`⚙`)** : ouvre le panneau de réglages rapides WhisperOrb (Langues, 7 Modèles IA, Envoi auto, 32 Couleurs d'Orbe) directement à la place des touches.
              5. **Bouton ON/OFF en temps réel (Carte 1)** : affiche ou masque instantanément le bandeau en haut du clavier intégré, plus option **Bulle Flottante Universelle** indépendante.
          files: WhisperOrb-Android.apk
          draft: false
          prerelease: false
          make_latest: true

  build-ipa:
    name: Compile Unsigned iPadOS/iOS IPA on macOS 15
    runs-on: macos-15
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: 3. Download Official whisper.cpp Metal GPU XCFramework
        run: |
          mkdir -p Frameworks
          curl -fL "https://github.com/ggml-org/whisper.cpp/releases/download/b5454/whisper-b5454-xcframework.zip" -o /tmp/whisper-xcf.zip
          unzip -q -o /tmp/whisper-xcf.zip -d /tmp/
          rm -rf Frameworks/whisper.xcframework
          mv /tmp/build-apple/whisper.xcframework Frameworks/whisper.xcframework
          plutil -replace MinimumOSVersion -string "16.0" Frameworks/whisper.xcframework/ios-arm64/whisper.framework/Info.plist

      - name: 4. Generate Xcode Project via XcodeGen
        run: xcodegen generate

      - name: 5. Build Release for iphoneos (Unsigned / Ad-Hoc)
        run: |
          xcodebuild build \
            -project WhisperOrb.xcodeproj \
            -scheme WhisperOrbApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 6. Package .app into WhisperOrb-iPad.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "WhisperOrbApp.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : WhisperOrbApp.app introuvable !"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -r9 WhisperOrb-iPad.ipa Payload
          ls -lh WhisperOrb-iPad.ipa

      - name: 7. Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperOrb-iPad-IPA
          path: WhisperOrb-iPad.ipa
          if-no-files-found: error

      - name: 8. Publish Apple IPA to GitHub Release v2.2.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "WhisperOrb v2.2.0 — Clavier Gboard/HeliBoard Natif avec Bandeau Incrusté (.apk & .ipa)"
          files: WhisperOrb-iPad.ipa
          draft: false
          prerelease: false
          make_latest: true
