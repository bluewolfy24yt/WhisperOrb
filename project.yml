name: WhisperOrb
options:
  bundleIdPrefix: com.bluewolfy24yt
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SwiftWhisper:
    url: https://github.com/exPHAT/SwiftWhisper.git
    from: 1.2.0

targets:
  WhisperOrbApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WhisperOrbApp
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: WhisperOrbApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluewolfy24yt.whisperorb
        INFOPLIST_FILE: WhisperOrbApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhisperOrbApp/WhisperOrbApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
    dependencies:
      - target: WhisperKeyboard
        embed: true
      - package: SwiftWhisper

  WhisperKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WhisperKeyboard
        excludes:
          - "*.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: WhisperKeyboard/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bluewolfy24yt.whisperorb.keyboard
        INFOPLIST_FILE: WhisperKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: WhisperKeyboard/WhisperKeyboard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_VERSION: "5.0"
        ENABLE_BITCODE: NO
